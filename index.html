<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly Block GDD</title>
<!--
  GDD TEMPLATE. How to use it: see TEMPLATE.md next to this file.
  FIXED sections (keep the logic, only change numbers): 1.3 Additional mechanics (includes the win screen bonus),
  2.1 FTUE logic, 5 Remote config, 6 IAP & offers, 7 Live ops.
  PER GAME sections: everything marked "PER GAME" in the script, plus the hero.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --ink:#18203A; --muted:#566079; --line:#D6DCE8; --tint:#E3E8F1;
  --rail:#232A40; --rail-ink:#EEF1F8; --rail-muted:#AAB3C9; --rail-line:rgba(255,255,255,.13); --rail-hover:rgba(255,255,255,.08);
  --track:#2A3149; --accent:#1F55D6; --focus:#1F55D6; --mark:#FFDF5E; --flash:rgba(255,214,64,.42); --wip:#FBE7A1;
  --c1:#D9363E; --c2:#2563EB; --c3:#1B8641; --c4:#F4BE0B; --c5:#F472B6; --c6:#F58220; --c7:#7C4DDB; --c8:#22B8D1;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rail-w:304px; --bar-h:0px;
  --hid:#7D8597; --ice:#4FB3DB; --door:#8A5A35; --veil:rgba(24,32,58,.58);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131826; --surface:#1B2234; --ink:#E9EDF7; --muted:#A3ADC4; --line:#2F3852; --tint:#232B41;
    --rail:#0E1220; --track:#0B0F1B; --accent:#8FB1FF; --focus:#8FB1FF; --flash:rgba(255,214,64,.26); --wip:#5A4B14;
    --hid:#6E778C; --ice:#8FD8F5; --door:#B98252; --veil:rgba(6,9,18,.66);
  }
}
:root[data-theme="dark"]{
  --paper:#131826; --surface:#1B2234; --ink:#E9EDF7; --muted:#A3ADC4; --line:#2F3852; --tint:#232B41;
  --rail:#0E1220; --track:#0B0F1B; --accent:#8FB1FF; --focus:#8FB1FF; --flash:rgba(255,214,64,.26); --wip:#5A4B14;
    --hid:#6E778C; --ice:#8FD8F5; --door:#B98252; --veil:rgba(6,9,18,.66);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 14px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.65 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.rail :focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr)}
main{container-type:inline-size;padding:48px clamp(20px,5vw,64px) 30vh;width:100%;max-width:1040px;min-width:0;margin-inline:auto}

/* ---------- rail (contents + search) ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;z-index:30;
  height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;background:var(--rail);color:var(--rail-ink)}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 14px;color:inherit;text-decoration:none;font:800 1.4rem/1.05 var(--display)}
.brand .cap{width:38px;height:38px}
.brand small{display:block;margin-top:3px;font:500 .8rem/1.2 var(--body);color:var(--rail-muted)}
.menu-btn{display:none}
.lang{display:grid;grid-template-columns:1fr 1fr;margin:0 18px 12px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1)}
.lang button{border:0;background:none;color:var(--rail-ink);font:600 .88rem/1 var(--body);padding:9px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#18203A}
.lang .short{display:none}
.search{position:relative;margin:0 18px 10px}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--rail-line);background:rgba(255,255,255,.07);
  color:var(--rail-ink);font:400 1rem/1 var(--body);padding:0 70px 0 40px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--rail-muted);opacity:1}
.search input:placeholder-shown{padding-right:46px}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;left:13px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--rail-muted);pointer-events:none}
.search-r{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;gap:2px}
.hint{font-size:.8rem;color:var(--rail-muted);padding:0 6px;font-variant-numeric:tabular-nums}
.hint.key{border:1px solid var(--rail-line);border-radius:6px;padding:1px 7px;margin-right:6px}
.clr{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--rail-ink);font-size:1.5rem;line-height:1;cursor:pointer}
.clr:hover{background:var(--rail-hover)}
.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 10px 28px}
.rail[data-view="toc"] #results,.rail[data-view="results"] #toc{display:none}

.toc ol{list-style:none;margin:0;padding:0}
.toc>ol>li{margin-bottom:6px}
.toc a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--rail-ink);text-decoration:none;font-weight:600;font-size:.96rem;line-height:1.3}
.toc a .cap{width:26px;height:26px}
.toc a .tl{flex:1;min-width:0}
.toc ol ol a{font-weight:400;font-size:.92rem;color:var(--rail-muted);padding:6px 10px 6px 12px}
.toc ol ol .num{flex:none;width:2.1em;text-align:right;font-variant-numeric:tabular-nums}
.toc a:hover{background:var(--rail-hover)}
.toc a.on{background:rgba(255,255,255,.14);color:#fff}
.toc .wipt{flex:none;font-size:.72rem;font-weight:600;color:#18203A;background:var(--c4);border-radius:999px;padding:1px 7px}

.res-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 10px 8px;color:var(--rail-muted);font-size:.86rem}
.linkbtn{border:0;background:none;color:var(--rail-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;font-size:.86rem}
.res{display:block;padding:9px 10px;border-radius:10px;color:var(--rail-ink);text-decoration:none}
.res:hover,.res[aria-current="true"]{background:var(--rail-hover)}
.res[aria-current="true"]{box-shadow:inset 3px 0 0 var(--mark)}
.res .crumb{display:block;font-size:.78rem;color:var(--rail-muted);margin-bottom:2px}
.res .snip{display:block;font-size:.9rem;line-height:1.45;overflow-wrap:anywhere}
.res mark{background:var(--mark);color:#18203A;border-radius:3px;padding:0 2px}
.res-empty{padding:6px 10px;font-size:.92rem;line-height:1.5}
.res-empty p{margin:0 0 8px}
.res-empty .muted{color:var(--rail-muted)}
.res-tip{padding:10px 10px 0;color:var(--rail-muted);font-size:.8rem}

/* ---------- caps ---------- */
.cap{position:relative;display:inline-grid;place-items:center;flex:none;width:1.5em;height:1.5em;color:var(--cc,var(--c2));--on:#fff}
.cap svg{position:absolute;inset:0;width:100%;height:100%}
.cap b{position:relative;font:800 1em/1 var(--display);color:var(--on);transform:translateY(.04em)}
.c1{--cc:var(--c1)}.c2{--cc:var(--c2)}.c3{--cc:var(--c3)}.c4{--cc:var(--c4)}
.c5{--cc:var(--c5)}.c6{--cc:var(--c6)}.c7{--cc:var(--c7)}.c8{--cc:var(--c8)}
.c4,.c5,.c6,.c8{--on:#18203A}

/* ---------- hero ---------- */
.hero{display:grid;gap:32px}
.hero h1{font:800 clamp(2.9rem,9cqi,4.6rem)/.95 var(--display);margin:0;letter-spacing:-.01em}
.hero .kind{font:600 1.25rem/1.3 var(--display);color:var(--muted);margin:8px 0 0}
.hero .pitch{font-size:1.12rem;line-height:1.6;max-width:44ch;margin:18px 0 0}
.legend{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:2px;max-width:520px}
.legend button{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;border:0;background:none;color:inherit;border-radius:12px;padding:8px;margin-left:-8px;cursor:pointer;line-height:1.45}
.legend button:hover,.legend button[aria-pressed="true"]{background:var(--tint)}
.pinl{display:block;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 .92rem/27px var(--display);text-align:center}
.legend b{font-weight:600}
.legend .d{display:block;color:var(--muted);font-size:.94rem}
.field{margin:0;justify-self:start;width:100%;max-width:372px}
.field-box{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:16px;overflow:hidden}
.field svg{display:block;width:100%;height:auto}
.field figcaption{font-size:.86rem;line-height:1.5;color:var(--muted);margin:10px 4px 0}
.field-foot{display:flex;justify-content:flex-end;margin:8px 4px 0}
.pause{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:500;cursor:pointer}
.track{fill:none;stroke:var(--track);stroke-width:50}
.trackfill{fill:var(--track)}
.belt-dot{fill:none;stroke-linecap:round;stroke-width:8.4;stroke-dashoffset:var(--o);animation:belt 7s linear infinite}
@keyframes belt{to{stroke-dashoffset:calc(var(--o) - 8px)}}
.field.paused .belt-dot{animation-play-state:paused}
.s1{stroke:var(--c1)}.s2{stroke:var(--c2)}.s3{stroke:var(--c3)}.s4{stroke:var(--c4)}.s5{stroke:var(--c5)}.s6{stroke:var(--c6)}.s7{stroke:var(--c7)}.s8{stroke:var(--c8)}
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}.f5{fill:var(--c5)}.f6{fill:var(--c6)}.f7{fill:var(--c7)}.f8{fill:var(--c8)}
.slot{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 5}
.lip{fill:#000;opacity:.26}
.bn{font:800 19px var(--display);text-anchor:middle;fill:#fff}
.bn.l{fill:#18203A}
.pin circle{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.pin text{font:700 12.5px var(--display);text-anchor:middle;fill:var(--paper)}
/* element demos */
.demo{margin:14px 0 0;max-width:212px}
.demo-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 6px}
.demo svg{display:block;width:100%;height:auto;overflow:visible}
.demo .scene g,.demo .scene circle,.demo .scene rect,.demo .scene line,.demo .scene path{transform-box:fill-box;transform-origin:center}
.demo figcaption{font-size:.8rem;line-height:1.45;color:var(--muted);margin:8px 2px 0}
.demo-btn{position:absolute;right:6px;bottom:6px;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.demo-btn svg{width:11px;height:11px;fill:currentColor}
.demo-btn .i-play,.demo-btn[aria-pressed="true"] .i-pause{display:none}
.demo-btn[aria-pressed="true"] .i-play{display:block}
.bn.sm{font-size:15px}
.chain{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:6 3;stroke-linecap:round}
.veil{fill:var(--veil)}
.padlock path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.padlock rect{fill:#fff}
.padlock.ink path{stroke:var(--ink)}
.padlock.ink rect{fill:var(--ink)}
.hidbox{fill:var(--hid)}
.qmark{font:800 17px var(--display);text-anchor:middle;fill:#fff}
.ice{fill:none;stroke:var(--ice);stroke-width:3}
.door{fill:var(--door)}
.smoke circle{fill:var(--line)}
.tap{fill:none;stroke:var(--ink);stroke-width:2.5}
.lkslot{fill:var(--tint);stroke:var(--muted);stroke-width:1.6}
.part{transition:opacity .18s ease}
.field[data-hl] .part{opacity:.2}
.field[data-hl="A"] .part-A,.field[data-hl="B"] .part-B,.field[data-hl="C"] .part-C,.field[data-hl="D"] .part-D,.field[data-hl="E"] .part-E{opacity:1}
@container (min-width:780px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:48px;align-items:start}
  .field{justify-self:end}
}

/* ---------- sections ---------- */
.sec{margin-top:88px}
.sec>h2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font:800 2.15rem/1.15 var(--display);margin:0}
.sec>h2 .cap{width:48px;height:48px;font-size:1.6rem}
.sec-intro{color:var(--muted);max-width:68ch;margin:10px 0 0}
.sub>.sec-intro{margin:0 0 14px}
.sub{margin-top:44px}
.sub>h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font:700 1.5rem/1.2 var(--display);margin:0 0 12px}
.sub>h3 .num{color:var(--muted);font-weight:600}
.wip{font:600 .8rem/1.2 var(--body);background:var(--wip);color:var(--ink);padding:4px 11px;border-radius:999px;white-space:nowrap;align-self:center}
.empty{color:var(--muted);font-style:italic;margin:0}
.sec>h2 + .ent,.sec>h2 + .tbl,.sec>h2 + .sec-intro + .ent{margin-top:22px}

.ent{padding:18px 0 16px;border-top:1px solid var(--line)}
.ent-h h4,.defs dt{font:700 1.14rem/1.3 var(--display);margin:0}
.ent-h{min-width:0}
.orig{display:block;font:500 .82rem/1.3 var(--body);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;font-size:.84rem;font-weight:500;line-height:1.35}
.tags span{display:inline-block;background:var(--tint);color:var(--ink);border-radius:8px;padding:3px 9px}
.ent-b{margin-top:8px;min-width:0}
.ent-b>p{margin:0 0 8px;max-width:68ch}
.defs{margin:0}
.defs>div{padding:16px 0;border-top:1px solid var(--line)}
.defs dd{margin:6px 0 0;max-width:68ch}
@container (min-width:720px){
  .ent,.defs>div{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 32px}
  .ent-b,.defs dd{margin-top:0}
}

ul.bl,ul.params{list-style:none;margin:0;padding:0}
ul.bl>li{position:relative;padding-left:1.2em;margin:0 0 .45em;max-width:68ch}
ul.bl>li::before{content:"";position:absolute;left:.12em;top:.66em;width:.38em;height:.38em;border-radius:50%;background:var(--muted)}
ul.bl ul.bl{margin:.4em 0 .2em}
ul.bl ul.bl>li::before{background:none;border:1.5px solid var(--muted)}
ol.steps{margin:.5em 0 .3em;padding-left:1.5em;max-width:66ch}
ol.steps>li{margin:0 0 .35em;padding-left:.2em}
ol.steps>li::marker{font-weight:700;font-family:var(--display)}
ol.steps ol.steps{list-style-type:lower-alpha;margin:.35em 0 .35em}
ol.steps .after{display:block;margin-top:.1em}
ul.params>li{margin:0 0 .7em;max-width:68ch}
ul.params>li>b{display:block;font-weight:600}
ul.params>li>span{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chips span{background:var(--tint);border-radius:8px;padding:3px 11px;font-weight:500}
.note{background:var(--tint);border-radius:14px;padding:12px 16px;max-width:68ch;margin:16px 0 4px;font-size:.95rem}
/* template placeholders: replace every .ph with real content */
.ph{display:inline;color:var(--muted);font-style:italic;background:var(--tint);border:1.5px dashed var(--muted);border-radius:6px;padding:0 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}.note b{font-weight:600}

/* ---------- tables ---------- */
.tbl{overflow-x:auto;margin:6px 0 4px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:.96rem;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--line)}
thead th{font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap}
tbody th{font-weight:600}
tbody tr:last-child>*{border-bottom:0}
.wide table{min-width:760px}
.xwide table{min-width:820px}
.xwide th,.xwide td{padding:12px 9px}
.xwide th:first-child,.xwide td:first-child{padding-left:14px}
.xwide code{font-size:.8em;padding:1px 5px}
.xwide thead th{white-space:normal;vertical-align:bottom}
.xwide tbody th[scope=row],.xwide tbody td{white-space:nowrap}
.xwide tbody td.wrap{white-space:normal;min-width:96px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp th{background:var(--tint);font-weight:700;padding-block:8px}
.tbl ul.bl{margin:0}
.tbl.compact table{min-width:0}
.gbox .tbl{margin:0;background:var(--surface)}
.tbl ul.bl>li{margin:0 0 .3em}
.pops table{min-width:960px;font-size:.92rem}
.pops th,.pops td{padding:11px 10px}
.pops tbody th[scope=row]{min-width:130px}
.pops td:nth-child(4),.pops td:nth-child(5),.pops td:nth-child(6){min-width:170px}
.pops code{font-size:.82em}
.lvl{font:800 1.35rem/1.1 var(--display)}
.dash{color:var(--muted)}
.popup{display:inline-block;white-space:nowrap;font:700 1.02rem/1.25 var(--display);border:2px solid var(--ink);border-radius:12px;padding:6px 13px;text-align:center}
.gloss{display:block;white-space:nowrap;color:var(--muted);font-size:.87rem;line-height:1.4;margin-top:6px}
.steps-tbl tbody{counter-reset:st}
.steps-tbl tbody th{position:relative;padding-left:52px;min-width:200px}
.steps-tbl tbody th::before{counter-increment:st;content:counter(st);position:absolute;left:16px;top:12px;width:1.55em;height:1.55em;border-radius:50%;background:var(--ink);color:var(--surface);font:700 .9rem/1.6em var(--display);text-align:center}
.hap{white-space:nowrap}
.hap i{font-style:normal;letter-spacing:.12em;margin-right:.45em}
.cat{color:var(--muted)}

/* ---------- colour list + unlock timeline ---------- */
.colors{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px;max-width:420px}
.colors li{display:grid;justify-items:center;gap:6px;text-align:center;font-size:.9rem;line-height:1.3}
.colors .cap{width:56px;height:56px;font-size:1.7rem}
@container (min-width:640px){.colors{grid-template-columns:repeat(8,minmax(0,1fr));max-width:none}}
.glance{margin-top:44px}
.glance h4{font:700 1.14rem/1.3 var(--display);margin:0 0 4px}
.glance>p{margin:0;color:var(--muted);max-width:68ch;font-size:.95rem}
.timeline{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:30px 0}
.timeline li{position:relative;padding:16px 14px 0 0;border-top:2px solid var(--line);line-height:1.35}
.timeline li::before{content:"";position:absolute;top:-8px;left:0;width:14px;height:14px;border-radius:50%;background:var(--ink)}
.timeline li.boost::before{background:var(--paper);border:3.5px solid var(--ink)}
.timeline .lv{display:block;font:800 1.3rem/1.2 var(--display)}
.timeline .nm{display:block;font-weight:600;font-size:.95rem}
.timeline .nm a{color:inherit}
.timeline .kd{display:block;color:var(--muted);font-size:.84rem}

/* ---------- additional mechanics: panels, tiles, flow chart ---------- */
code{font:500 .9em/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--tint);border-radius:6px;padding:1px 6px;white-space:nowrap}
.gbox code,.node code{background:var(--paper)}
.ent.sys{padding:28px 0 30px}
.ent-b>p.lead{margin:0 0 16px}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px;margin:0 0 14px}
.gbox:last-child{margin-bottom:0}
.gbox-h{font:700 1.06rem/1.3 var(--display);margin:0 0 12px}
.gbox-h small{display:block;font:500 .86rem/1.4 var(--body);color:var(--muted);margin-top:1px}
.gbox>p{margin:0 0 10px;max-width:68ch}
.gbox>:last-child{margin-bottom:0}
.gbox .note{margin:14px 0 0;max-width:none}
.tiles{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}
.tiles li{background:var(--tint);border-radius:12px;padding:10px 14px 11px;line-height:1.35}
.tiles .tv{display:block;font:800 1.45rem/1.15 var(--display)}
.tiles .tk{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.tiles li.hot{background:var(--ink);color:var(--paper)}
.tiles li.hot .tk{color:inherit;opacity:.85}
.ent-b>.tiles{max-width:520px;margin-bottom:0}
.ent-b>.tiles li{background:var(--surface);border:1px solid var(--line)}
.ent-b>.tiles li.hot{background:var(--ink);border-color:var(--ink)}
.ent-b>.tiles:has(li:nth-child(4)){max-width:none;margin-bottom:16px}
.cases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cases li{background:var(--tint);border-radius:12px;padding:10px 14px;font-weight:500;line-height:1.4}
.kv{margin:0}
.kv>div{padding:11px 0;border-top:1px solid var(--line)}
.kv>div:first-child{border-top:0;padding-top:0}
.kv>div:last-child{padding-bottom:0}
.kv dt{font-weight:600}
.kv dd{margin:2px 0 0}
@container (min-width:640px){
  .kv>div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px}
  .kv dd{margin:0}
}
.upm{display:flex;align-items:center;gap:14px;background:var(--tint);border-radius:12px;padding:24px 18px 18px;max-width:460px}
.upm-w{position:relative}
.upm-w.bar{flex:1;min-width:0}
.upm-pin{position:absolute;top:-15px;left:-8px;z-index:1;box-shadow:0 0 0 2px var(--tint)}
.upm-bar{position:relative;height:26px;border-radius:999px;background:var(--track);overflow:hidden}
.upm-fill{position:absolute;left:0;top:0;bottom:0;width:60%;background:var(--c3);border-radius:999px}
.upm-n{position:absolute;inset:0;display:grid;place-items:center;font:800 .95rem/1 var(--display);color:#fff}
.upm-box{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.upm-box .cap{font-size:1.3rem}
.gbox>p.upm-cap{font-size:.86rem;line-height:1.5;color:var(--muted);margin:8px 2px 16px}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:68ch}
.parts li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;line-height:1.5}
.parts b{display:block;font-weight:600}
.parts .d{display:block}
.flow{max-width:660px}
.node{background:var(--tint);border-radius:12px;padding:10px 14px 11px}
.node p{margin:0}
.node .k{display:block;font:600 .82rem/1.4 var(--body);color:var(--muted)}
.node .cond{font-weight:600;margin-bottom:4px}
.arrow{text-align:center;color:var(--muted);font-size:1.15rem;line-height:1;padding:5px 0 6px}
.split{display:grid;gap:8px 12px}
@container (min-width:600px){.split{grid-template-columns:1fr 1fr}}
.yn{display:inline-block;font:700 .82rem/1.2 var(--display);border-radius:999px;padding:3px 10px 2px;margin-right:8px;background:var(--ink);color:var(--paper);vertical-align:.08em}
.yn.no{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.fx{display:block;margin-top:6px}
.fx code{white-space:normal;display:inline-block;padding:3px 8px}
.lvgrid{display:grid;gap:8px;max-width:540px;margin:0 0 14px}
.lvrow{display:grid;grid-template-columns:clamp(70px,27%,158px) minmax(0,1fr);gap:10px;align-items:center}
.lvk{font-weight:600;font-size:.88rem;line-height:1.3;color:var(--muted)}
.lvcells{display:grid;grid-template-columns:repeat(6,minmax(0,52px));gap:clamp(4px,1.2cqi,8px);justify-items:center;align-items:center}
.lvcells .fr{font:800 clamp(.8rem,3.9cqi,1rem)/1.3 var(--display);white-space:nowrap}
.lvcells .sq{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:10px;background:var(--tint);font:700 1.1rem/1 var(--display)}
.lvcells .nw{font:700 .76rem/1 var(--display);background:var(--c3);color:#fff;border-radius:999px;padding:4px 8px 3px;white-space:nowrap}
.ent-b>.tiles+ul.bl{margin-top:16px}
.ent-b>.tbl,.ent-b>.kv{margin:14px 0}
.gbox>.tbl+p,.gbox>.kv+.tbl{margin-top:12px}
.tbl+.tbl{margin-top:14px}
.gbox>p .chips,.kv .chips{margin:0}
.note ul.bl{margin-top:6px}
.note ul.bl>li{margin-bottom:.3em}
.node ul.bl{margin-top:4px}
.node ul.bl>li{margin-bottom:.2em}
.gbox code,.state code{background:var(--paper)}

/* ---------- live-ops state cards ---------- */
.states{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.state{background:var(--tint);border-radius:12px;padding:12px 14px}
.state .sn{margin:0 0 6px;font-weight:600;line-height:1.5}
.state .sn small{display:block;font-weight:500;color:var(--muted);font-size:.86rem}
.state>p{margin:0 0 8px}
.go{list-style:none;margin:0;padding:8px 0 0;border-top:1px solid var(--line)}
.go li{margin:0 0 .25em;padding-left:1.3em;text-indent:-1.3em}
.go li::before{content:"→ ";color:var(--muted);font-weight:700}

/* ---------- win-screen gauge ---------- */
.gauge{max-width:400px}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gseg{stroke:var(--surface);stroke-width:2;transition:opacity .2s}
.g2{fill:var(--c2)}.g3{fill:var(--c3)}.g5{fill:var(--c4)}
.gauge.stopped .gseg:not(.on){opacity:.3}
.gseg.on{stroke:var(--ink);stroke-width:3}
.glab{font:800 17px var(--display);text-anchor:middle;fill:#fff;pointer-events:none}
.glab.l{fill:#18203A}
.needle{fill:var(--ink)}
.hub{fill:var(--ink);stroke:var(--surface);stroke-width:3}
.gbase{margin:6px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
.gctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px}
.gctl>span{display:flex;align-items:center;gap:8px}
.gctl .pinl{width:22px;height:22px;font-size:.8rem;line-height:23px}
.gbtn{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:600;cursor:pointer;min-height:40px}
.gbtn.primary{background:var(--ink);color:var(--paper)}
.gres{margin:12px 0 0;font-weight:500;min-height:3.2em;max-width:52ch}
.gres strong{font:800 1.15rem/1.2 var(--display)}

/* ---------- search hits in the page ---------- */
mark.hit{background:var(--mark);color:#18203A;border-radius:3px;padding:0 1px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{background-color:var(--flash)}100%{background-color:transparent}}

/* ---------- small screens: rail becomes a top bar ---------- */
@media (max-width:959px){
  :root{--bar-h:60px}
  .app{display:block}
  main{padding-top:28px}
  .rail{height:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px}
  .brand{display:none}
  .menu-btn{order:1;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:inherit;cursor:pointer}
  .menu-btn svg{width:20px;height:20px}
  .search{order:2;margin:0}
  .search input{padding-right:78px}
  .search input:placeholder-shown{padding-right:10px}
  .lang{order:3;margin:0}
  .lang button{padding:11px 11px}
  .lang .full,.hint.key{display:none}
  .lang .short{display:inline}
  .panel{display:none;position:absolute;left:0;right:0;top:100%;max-height:min(70vh,560px);background:var(--rail);
    border-top:1px solid var(--rail-line);box-shadow:0 22px 36px rgba(8,11,22,.4);padding:10px 10px 18px}
  .rail[data-open="1"] .panel{display:block}
  .res-tip{display:none}
  .sec{margin-top:64px}
  .sec>h2{font-size:1.8rem}
  .sec>h2 .cap{width:42px;height:42px;font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){
  .part{transition:none}
}
@media print{
  .rail,.field-foot{display:none}
  .app{display:block}
  main{padding:0;max-width:none}
  .sec{margin-top:40px}
  .belt-dot{animation:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="cap" viewBox="-50 -50 100 100">
      <path id="capPath" fill="currentColor"/>
      <circle r="35" fill="#fff" opacity=".17"/>
      <circle r="35" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header class="rail" id="rail" data-view="toc" data-open="">
    <a class="brand" href="#top">
      <span class="cap c2"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#cap"/></svg></span>
      <span>Jelly Block<small id="brandSub">Game design document</small></span>
    </a>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="panel" aria-label="Contents">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9"/></svg>
    </button>
    <div class="lang" id="langSwitch" role="group" aria-label="Language">

      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Search the GDD" aria-label="Search the GDD">

<script>
(function(){
'use strict';

/* ---------- small helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const GAME='Jelly Block';
const GBASE=40;  /* win-screen base coin reward, matches level_win_coin */
const PID='jelly.block';

/* crown-cap outline: a real bottle cap has 21 teeth */
(function(){
  const teeth=21,steps=teeth*8;let d='';
  for(let i=0;i<steps;i++){
    const a=i/steps*Math.PI*2,r=45.4+3.4*Math.cos(teeth*a);
    d+=(i?'L':'M')+(r*Math.cos(a)).toFixed(2)+' '+(r*Math.sin(a)).toFixed(2);
  }
  $('#capPath').setAttribute('d',d+'Z');
})();
const cap=(c,label)=>`<span class="cap c${c}" data-nosearch><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#cap"/></svg>${label!=null?`<b>${label}</b>`:''}</span>`;

/* ---------- document outline ---------- */
const SECTIONS=[
  {id:'game-mechanics',n:'1',c:1,en:'Game mechanics',vi:'Cơ chế trò chơi',subs:[
    {id:'gameplay-overview',n:'1.1',en:'Gameplay overview',vi:'Tổng quan lối chơi'},
    {id:'main-game-mechanics',n:'1.2',en:'Main game mechanics',vi:'Cơ chế chính'},
    {id:'additional-mechanics',n:'1.3',en:'Additional mechanics',vi:'Cơ chế bổ sung'},
    {id:'elements-mechanics',n:'1.4',en:'Elements',vi:'Yếu tố đặc biệt'},
    {id:'booster-mechanics',n:'1.5',en:'Boosters',vi:'Công cụ hỗ trợ'}]},
  {id:'ftue--tutorial',n:'2',c:2,en:'FTUE & tutorial',vi:'FTUE & hướng dẫn',subs:[
    {id:'ftue-logic',n:'2.1',en:'FTUE logic',vi:'Cách FTUE hoạt động'},
    {id:'ftue-steps',n:'2.2',en:'FTUE steps',vi:'Các bước FTUE'},
    {id:'element-tutorial',n:'2.3',en:'Element tutorial',vi:'Hướng dẫn yếu tố đặc biệt'},
    {id:'booster-tutorial',n:'2.4',en:'Booster tutorial',vi:'Hướng dẫn công cụ hỗ trợ'}]},
  {id:'object-set--animation',n:'3',c:3,en:'Object set & animation',vi:'Đối tượng & chuyển động',subs:[
    {id:'game-concept',n:'3.1',en:'Game concept',vi:'Ý tưởng game'},
    {id:'core-game-object-concept',n:'3.2',en:'Core game objects',vi:'Đối tượng chính'},
    {id:'element-object-concept',n:'3.3',en:'Element objects',vi:'Đối tượng yếu tố đặc biệt'},
    {id:'booster-object-concept',n:'3.4',en:'Booster objects',vi:'Đối tượng công cụ hỗ trợ'}]},
  {id:'sfx--haptics',n:'4',c:4,en:'SFX & haptics',vi:'Âm thanh & rung'},
  {id:'remote-config',n:'5',c:5,en:'Remote config',vi:'Cấu hình từ xa'},
  {id:'iap--offers',n:'6',c:8,en:'IAP & offers',vi:'Mua trong game & ưu đãi',subs:[
    {id:'pack-list',n:'6.1',en:'Pack list',vi:'Danh sách gói'},
    {id:'store',n:'6.2',en:'Store',vi:'Cửa hàng'},
    {id:'starter-pack',n:'6.3',en:'Starter Pack',vi:'Gói Khởi đầu'},
    {id:'remove-ads',n:'6.4',en:'Remove Ads',vi:'Gỡ quảng cáo'}]},
  {id:'live-ops',n:'7',c:6,en:'Live ops',vi:'Tính năng Live Ops',subs:[
    {id:'popup-list',n:'7.1',en:'Popup list',vi:'Danh sách popup'},
    {id:'popup-priority',n:'7.2',en:'Popup priority',vi:'Thứ tự ưu tiên popup'}]},
  {id:'change-note',n:'8',c:7,en:'Change note',vi:'Ghi chú thay đổi'}
];
const SEC={};
SECTIONS.forEach(s=>{SEC[s.id]=s;(s.subs||[]).forEach(u=>{SEC[u.id]=u;});});

const UI={
  en:{sub:'Game design document',search:'Search the GDD',searchShort:'Search',contents:'Contents',language:'Language',clear:'Clear search',
      matches:n=>n===1?'1 match':n+' matches',none:q=>`No matches for “${q}”.`,tryShort:'Try a shorter or different word.',
      other:n=>(n===1?'1 match':n+' matches')+' in the Vietnamese version.',switchTo:'Switch to Tiếng Việt',
      tip:'Enter jumps to the next match. Esc clears.',overview:'Overview',wip:'In progress',
      pause:'Pause motion',play:'Play motion',pauseDemo:'Pause demo',playDemo:'Play demo',title:GAME+' GDD',
      bonus:'Bonus',again:'Swing again',swing:'Swing',next:'Next level',
      gTap:'Tap Bonus to stop the needle.',gStart:'Tap Swing to start the needle.',
      gRes:m=>`<strong>×${m}</strong> → ${GBASE} × ${m} = ${GBASE*m} coins. In the game, the rewarded ad plays after a 1-second pause, then the coins fly in.`,
      gNext:`<strong>${GBASE} coins</strong>. The player skips the bonus and takes the base reward.`},
  vi:{sub:'Tài liệu thiết kế game',search:'Tìm trong tài liệu',searchShort:'Tìm kiếm',contents:'Mục lục',language:'Ngôn ngữ',clear:'Xóa tìm kiếm',
      matches:n=>n+' kết quả',none:q=>`Không tìm thấy “${q}”.`,tryShort:'Hãy thử từ khóa ngắn hơn hoặc từ khác.',
      other:n=>`Có ${n} kết quả trong bản tiếng Anh.`,switchTo:'Chuyển sang English',
      tip:'Nhấn Enter để tới kết quả kế tiếp. Nhấn Esc để xóa.',overview:'Tổng quan',wip:'Đang viết',
      pause:'Dừng chuyển động',play:'Chạy chuyển động',pauseDemo:'Dừng minh họa',playDemo:'Chạy minh họa',title:GAME+' GDD',
      bonus:'Thưởng thêm',again:'Cho kim chạy lại',swing:'Cho kim chạy',next:'Màn tiếp theo',
      gTap:'Chạm “Thưởng thêm” để dừng kim.',gStart:'Chạm “Cho kim chạy” để kim bắt đầu lắc.',
      gRes:m=>`<strong>×${m}</strong> → ${GBASE} × ${m} = ${GBASE*m} xu. Trong game, quảng cáo có thưởng sẽ chạy sau 1 giây, rồi xu bay vào.`,
      gNext:`<strong>${GBASE} xu</strong>. Người chơi bỏ qua phần thưởng thêm và nhận phần thưởng gốc.`}
};

/* ---------- animated sketches ----------
   Jelly Block: the play-screen sketch in the hero (level 23) and one looping demo per element and booster.
   Template note, kept for reference:
   and one looping demo per element. Reuse the pattern for a new game:
     DEMOS key:{D:<loop seconds>, svg:()=>`<markup inside a 200×196 box>`, tracks:()=>[[selector,property,[[time,value],…]],…]}
     fieldSVG(): an <svg viewBox="0 0 340 466"> with each legend part in <g class="part part-A"> … part-E.
   Demo keys ready to reuse: elements hidden, locked, linked, door, lockedBox, blockQueue, lockedSlot;
   boosters hand, shuffle, magnet. */
/* ---------- play-screen sketch ---------- */
function rr(x,y,w,h,r){
  return `M${x+r},${y}H${x+w-r}A${r},${r} 0 0 1 ${x+w},${y+r}V${y+h-r}A${r},${r} 0 0 1 ${x+w-r},${y+h}H${x+r}A${r},${r} 0 0 1 ${x},${y+h-r}V${y+r}A${r},${r} 0 0 1 ${x+r},${y}Z`;
}
const LIGHT={4:1,5:1,6:1,8:1};
const SZ={2:16,3:24,4:32,5:40,6:24};
function boxSVG(x,y,w,h,c,n){
  return `<rect class="f${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/><rect class="lip" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/>`+
         `<rect class="f${c}" x="${x}" y="${y}" width="${w}" height="${h-5}" rx="9"/>`+
         `<text class="bn${LIGHT[c]?' l':''}" x="${x+w/2}" y="${y+(h-5)/2}" dy=".34em">${SZ[n]||n}</text>`;
}
function pin(x,y,l){return `<g class="pin"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${y}" dy=".34em">${l}</text></g>`;}
/* ---------- element demos: small looping sketches, one per element ---------- */
const DSX=[19,61,103,145],BW=34,BH=32;
function T(x,y,s){return `translate(${x}px,${y}px)`+(s!=null?` scale(${s})`:'');}
function mbox(x,y,c,n){
  return `<rect class="f${c}" x="${x}" y="${y}" width="${BW}" height="${BH}" rx="8"/><rect class="lip" x="${x}" y="${y}" width="${BW}" height="${BH}" rx="8"/>`+
         `<rect class="f${c}" x="${x}" y="${y}" width="${BW}" height="${BH-4}" rx="8"/><text class="bn sm${LIGHT[c]?' l':''}" x="${x+BW/2}" y="${y+(BH-4)/2}" dy=".35em">${SZ[n]||n}</text>`;
}
function dslots(y,skip){return DSX.map((x,i)=>skip&&skip.includes(i)?'':`<rect class="slot" x="${x}" y="${y}" width="36" height="36" rx="8"/>`).join('');}
function cdBadge(cx,cy,extra){
  const vals=['2','1','0'].concat(extra||[]);
  return `<g class="pin cdg"><circle cx="${cx}" cy="${cy}" r="9.5"/>${vals.map((v,i)=>`<text class="v${i}" x="${cx}" y="${cy}" dy=".35em"${i?' style="opacity:0"':''}>${v.replace(/b$/,'')}</text>`).join('')}</g>`;
}
function padlock(cx,cy,ink){return `<g class="padlock${ink?' ink':''}"><path d="M${cx-4.5},${cy-1}v-3.5a4.5,4.5 0 0 1 9,0v3.5"/><rect x="${cx-7}" y="${cy-1}" width="14" height="11" rx="2.5"/></g>`;}
function cdTracks(sel,a,b){return [[`${sel} .v0`,'opacity',[[0,1],[a,1],[a+.12,0]]],[`${sel} .v1`,'opacity',[[0,0],[a,0],[a+.12,1],[b,1],[b+.12,0]]],[`${sel} .v2`,'opacity',[[0,0],[b,0],[b+.12,1]]]];}
/* booster demos: a tap ring shows where the player taps, a puff shows a box clearing */
function tap(cx,cy){return `<circle class="tap" cx="${cx}" cy="${cy}" r="15" style="opacity:0"/>`;}
function tapTracks(t){return [['.tap','opacity',[[0,0],[t,0],[t+.1,.9],[t+.55,0]]],['.tap','transform',[[t,'scale(.5)'],[t+.55,'scale(1.35)']]]];}
function puff(cx,cy){return `<g class="smoke">${[[-9,-4,9],[10,-2,10],[0,9,11],[-3,-10,7]].map(([dx,dy,r])=>`<circle cx="${cx+dx}" cy="${cy+dy}" r="${r}" style="opacity:0"/>`).join('')}</g>`;}
function puffTracks(t){return [['.smoke circle','transform',[[t,'scale(.3)'],[t+.6,'scale(1.4)']]],['.smoke circle','opacity',[[0,0],[t,0],[t+.15,.95],[t+.6,0]]]];}
/* ---------- Jelly Block drawing helpers ----------
   Board, block, stud and element pieces in board-cell units. o={ox,oy,cs}: board origin and cell size. */
const RIM='#4A4FA8';
function jboard(o,rects){
  const {ox,oy,cs}=o;let s='';
  s+=rects.map(([c,r,w,h])=>`<rect x="${ox+c*cs-5}" y="${oy+r*cs-5}" width="${w*cs+10}" height="${h*cs+10}" rx="10" fill="${RIM}"/>`).join('');
  s+=rects.map(([c,r,w,h])=>`<rect class="trackfill" x="${ox+c*cs}" y="${oy+r*cs}" width="${w*cs}" height="${h*cs}" rx="5"/>`).join('');
  rects.forEach(([c,r,w,h])=>{for(let i=0;i<w;i++)for(let j=0;j<h;j++)s+=`<rect x="${ox+(c+i)*cs+1.5}" y="${oy+(r+j)*cs+1.5}" width="${cs-3}" height="${cs-3}" rx="4" fill="#fff" opacity=".06"/>`;});
  return s;
}
const cc=(o,c,r)=>[o.ox+c*o.cs+o.cs/2,o.oy+r*o.cs+o.cs/2];
/* X shape: colored (stud) or dark (x-shaped hole) */
function jx(cx,cy,r,col){
  return `<path d="M${cx-r} ${cy-r}L${cx+r} ${cy+r}M${cx+r} ${cy-r}L${cx-r} ${cy+r}" style="fill:none;stroke:${col?`var(--c${col})`:'#000'};stroke-width:${(r*.85).toFixed(1)};stroke-linecap:round${col?'':';opacity:.45'}"/>`;
}
/* a block: cells [[c,r],…], color 1–8 (or 'lock' for the stone block), hole [c,r,'o'|'x'] */
function jblock(o,cells,col,hole){
  const {ox,oy,cs}=o,p=2,set=new Set(cells.map(([c,r])=>c+','+r)),fc=col==='lock'?'hidbox':'f'+col;
  let s='';
  cells.forEach(([c,r])=>{
    const x=ox+c*cs,y=oy+r*cs,R=set.has((c+1)+','+r),D=set.has(c+','+(r+1));
    s+=`<rect class="${fc}" x="${x+p}" y="${y+p}" width="${cs-2*p}" height="${cs-2*p}" rx="${(cs*.22).toFixed(1)}"/>`;
    if(R)s+=`<rect class="${fc}" x="${x+cs-p-3}" y="${y+p}" width="${2*p+6}" height="${cs-2*p}"/>`;
    if(D)s+=`<rect class="${fc}" x="${x+p}" y="${y+cs-p-3}" width="${cs-2*p}" height="${2*p+6}"/>`;
    if(R&&D&&set.has((c+1)+','+(r+1)))s+=`<rect class="${fc}" x="${x+cs-p-3}" y="${y+cs-p-3}" width="${2*p+6}" height="${2*p+6}"/>`;
  });
  if(hole){
    const [hx,hy]=cc(o,hole[0],hole[1]);
    s+=hole[2]==='x'?jx(hx,hy,cs*.2):`<circle class="lip" cx="${hx}" cy="${hy}" r="${(cs*.22).toFixed(1)}"/><circle class="lip" cx="${hx}" cy="${hy+1}" r="${(cs*.19).toFixed(1)}"/>`;
  }
  return s;
}
function jstud(o,c,r,col,x){
  const [cx,cy]=cc(o,c,r);
  return x?jx(cx,cy,o.cs*.21,col):`<circle class="f${col}" cx="${cx}" cy="${cy}" r="${(o.cs*.27).toFixed(1)}" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>`;
}
/* white two-way arrow shown on an arrow block */
function jarrow(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux,h=7,w=6;
  const head=(x,y,s)=>`M${x} ${y}L${(x-s*ux*h+px*w).toFixed(1)} ${(y-s*uy*h+py*w).toFixed(1)}L${(x-s*ux*h-px*w).toFixed(1)} ${(y-s*uy*h-py*w).toFixed(1)}Z`;
  return `<path d="M${x1+ux*h} ${y1+uy*h}L${x2-ux*h} ${y2-uy*h}" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="${head(x2,y2,1)}${head(x1,y1,-1)}" fill="#fff"/>`;
}
/* spoon icon on a block, and the colored locked hole it opens */
function jspoon(cx,cy,col){
  return `<rect x="${cx-1.6}" y="${cy}" width="3.2" height="9" rx="1.6" fill="var(--c${col})" stroke="#fff" stroke-width="1.2"/><ellipse cx="${cx}" cy="${cy-4}" rx="4.6" ry="6" fill="var(--c${col})" stroke="#fff" stroke-width="1.6"/>`;
}
function jlockHole(cx,cy,col){return `<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="var(--c${col})" stroke-width="3"/>${padlock(cx,cy-2)}`;}
/* ice layer over frozen blocks and studs */
function jice(o,cells){const {ox,oy,cs}=o;return cells.map(([c,r])=>`<rect x="${ox+c*cs+1}" y="${oy+r*cs+1}" width="${cs-2}" height="${cs-2}" rx="${(cs*.24).toFixed(1)}" fill="var(--ice)" fill-opacity=".42" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>`).join('');}
function jiceStud(o,c,r){const [cx,cy]=cc(o,c,r);return `<circle cx="${cx}" cy="${cy}" r="${(o.cs*.42).toFixed(1)}" fill="var(--ice)" fill-opacity=".4" stroke="#fff" stroke-opacity=".85" stroke-width="1.5"/>`;}
/* counter text that steps through values */
function jcount(cx,cy,vals,cls){return vals.map((v,i)=>`<text class="bn sm ${cls}${i}" x="${cx}" y="${cy}" dy=".35em"${i?' style="opacity:0"':''}>${v}</text>`).join('');}
/* a block clears: pops and fades at time t */
function popTracks(sel,t){return [[sel,'opacity',[[0,1],[t+.25,1],[t+.4,0]]]];}
function popScale(sel,t,base){const b=base||'';return [[sel,'transform',[[t,b+' scale(1)'],[t+.15,b+' scale(1.12)'],[t+.4,b+' scale(.2)']]]];}

/* ---------- win-screen bonus gauge ---------- */
const MULT=[2,3,5,3,2],GX=130,GY=132,GR=112,Gr=60;
const f1=n=>+(+n).toFixed(1);
function gaugeSVG(label){
  const P=(rad,deg)=>{const a=deg*Math.PI/180;return [f1(GX+rad*Math.cos(a)),f1(GY-rad*Math.sin(a))];};
  let s='';
  MULT.forEach((m,i)=>{
    const a1=180-36*i,a2=180-36*(i+1);
    const [x1,y1]=P(GR,a1),[x2,y2]=P(GR,a2),[x3,y3]=P(Gr,a2),[x4,y4]=P(Gr,a1);
    s+=`<path class="gseg g${m}" data-seg="${i}" d="M${x1} ${y1}A${GR} ${GR} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${Gr} ${Gr} 0 0 0 ${x4} ${y4}Z"/>`;
    const [lx,ly]=P((GR+Gr)/2,(a1+a2)/2);
    s+=`<text class="glab${m===5?' l':''}" x="${lx}" y="${ly}" dy=".35em">×${m}</text>`;
  });
  return `<svg viewBox="0 0 260 146" role="img" aria-label="${esc(label)}">${s}
    <g id="needle"><path class="needle" d="M${GX-4} ${GY}L${GX} ${GY-GR+8}L${GX+4} ${GY}Z"/></g><circle class="hub" cx="${GX}" cy="${GY}" r="10"/>
    ${pin(12,22,'A')}${pin(GX+28,GY+2,'B')}</svg>`;
}
const G={swing:false,th:0,t0:0,raf:0,res:null};
const PERIOD=1.7,AMP=84;
const segOf=th=>Math.max(0,Math.min(4,Math.floor((th+90)/36)));
function gaugeMsg(l){
  const ui=UI[l];
  if(G.res==='bonus')return ui.gRes(MULT[segOf(G.th)]);
  if(G.res==='next')return ui.gNext;
  return G.swing?ui.gTap:ui.gStart;
}
function setNeedle(){const n=document.getElementById('needle');if(n)n.setAttribute('transform',`rotate(${G.th.toFixed(2)} ${GX} ${GY})`);}
function gaugeTick(ts){
  if(!G.swing){G.raf=0;return;}
  if(!G.t0)G.t0=ts;
  G.th=AMP*Math.sin((ts-G.t0)/1000*Math.PI*2/PERIOD);
  setNeedle();
  G.raf=requestAnimationFrame(gaugeTick);
}
function startSwing(){
  const ph=Math.asin(Math.max(-1,Math.min(1,G.th/AMP)));
  G.t0=performance.now()-ph/(Math.PI*2/PERIOD)*1000;
  G.swing=true;
  if(!G.raf)G.raf=requestAnimationFrame(gaugeTick);
}
function gaugeUI(){
  const g=$('#gauge');if(!g)return;
  const ui=UI[lang];
  g.classList.toggle('stopped',!G.swing);
  const on=!G.swing&&G.res==='bonus'?segOf(G.th):-1;
  $$('.gseg',g).forEach(p=>p.classList.toggle('on',+p.dataset.seg===on));
  const b=$('#gBonus');if(b)b.textContent=G.swing?ui.bonus:(G.res?ui.again:ui.swing);
  const r=$('#gRes');if(r)r.innerHTML=gaugeMsg(lang);
  setNeedle();
}

function tocHTML(l){

/* ---------- state ---------- */
const root=document.documentElement,main=$('#main'),rail=$('#rail'),panel=$('#panel'),toc=$('#toc'),results=$('#results'),
      q=$('#q'),hint=$('#hint'),clr=$('#clr'),menuBtn=$('#menuBtn');
const KEY='capsSortingGddLang';
let lang='en';
try{if(/^vi/i.test(navigator.language||''))lang='vi';}catch(e){}
try{const s=localStorage.getItem(KEY);if(s==='en'||s==='vi')lang=s;}catch(e){}

let index=[],hits=[],cur=-1,spyEls=[],active='top';
const narrow=window.matchMedia('(max-width:959px)'),statusEl=$('#status');
const otherCache={};

/* ---------- search ---------- */
const COMB=/[\u0300-\u036f]/;
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const lower=s=>s.toLowerCase();
const BLOCK='li,p,tr,h1,h2,h3,h4,figcaption,.blk';

function collect(rootEl){
  const map=new Map(),out=[];
  const w=document.createTreeWalker(rootEl,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;
    if(!p||p.closest('svg,[data-nosearch],script,style'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  while(w.nextNode()){
    const n=w.currentNode,b=n.parentElement.closest(BLOCK);
    if(!b)continue;
    let e=map.get(b);
    if(!e){e={el:b,nodes:[]};map.set(b,e);out.push(e);}
    e.nodes.push(n);
  }
  out.forEach(e=>{
    e.text=e.nodes.map(n=>n.nodeValue.replace(/\s+/g,' ').trim()).join(' ');
    e.fold=fold(e.text);e.lower=lower(e.text);
    const s=e.el.closest('[data-sec]');e.sec=s?s.dataset.sec:'top';
  });
  return out;
}
const LETTER=/\p{L}/u;
function term(w){
  const lo=lower(w),fo=fold(w),strict=fo!==lo;         // typed with accents → match accents exactly
  const s=strict?lo:fo;
  return {s,strict,whole:s.length===1};                // a single letter (e.g. “ô”) only matches as a whole word
}
function parseTerms(raw){
  return raw.normalize('NFC').trim().split(/\s+/).filter(Boolean).map(term).filter(tm=>tm.s.length>=2||tm.strict);
}
/* a multi-word query is tried as an exact phrase first, then as “all of these words” */
function resolveTerms(list,raw){
  const terms=parseTerms(raw);
  if(terms.length>1){
    const phrase=[term(raw.normalize('NFC').trim().replace(/\s+/g,' '))];
    const m=matchIn(list,phrase);
    if(m.length)return {terms:phrase,matched:m};
  }
  return {terms,matched:terms.length?matchIn(list,terms):[]};
}
function mapStr(str,fn){
  let f='';const map=[];
  for(let i=0;i<str.length;i++){const c=fn(str[i]);for(let k=0;k<c.length;k++){f+=c[k];map.push(i);}}
  return {f,map};
}
function findRanges(str,terms){
  const res=[];let fm=null,lm=null;
  terms.forEach(tm=>{
    const m=tm.strict?(lm||(lm=mapStr(str,lower))):(fm||(fm=mapStr(str,fold)));
    let i=0;
    while((i=m.f.indexOf(tm.s,i))!==-1){
      const a=m.map[i];let b=m.map[i+tm.s.length-1]+1;
      while(b<str.length&&COMB.test(str[b]))b++;
      if(!tm.whole||(!(a>0&&LETTER.test(str[a-1]))&&!(b<str.length&&LETTER.test(str[b]))))res.push([a,b]);
      i+=tm.s.length;
    }
  });
  res.sort((x,y)=>x[0]-y[0]);
  const merged=[];
  res.forEach(r=>{const last=merged[merged.length-1];if(last&&r[0]<=last[1])last[1]=Math.max(last[1],r[1]);else merged.push(r.slice());});
  return merged;
}
function markNode(node,terms){
  const rs=findRanges(node.nodeValue,terms);
  for(let i=rs.length-1;i>=0;i--){
    const r=document.createRange();r.setStart(node,rs[i][0]);r.setEnd(node,rs[i][1]);
    const m=document.createElement('mark');m.className='hit';
    try{r.surroundContents(m);}catch(e){}
  }
}
function clearMarks(){
  $$('mark.hit',main).forEach(m=>{const p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});
}
function markedHTML(str,terms){
  const rs=findRanges(str,terms);let h='',pos=0;
  rs.forEach(r=>{h+=esc(str.slice(pos,r[0]))+'<mark>'+esc(str.slice(r[0],r[1]))+'</mark>';pos=r[1];});
  return h+esc(str.slice(pos));
}
function snippet(e,terms){
  const txt=e.text,rs=findRanges(txt,terms),first=rs.length?rs[0][0]:0;
  let a=Math.max(0,first-34),b=Math.min(txt.length,first+92);
  if(a>0){const sp=txt.indexOf(' ',a);if(sp!==-1&&sp<first)a=sp+1;}
  if(b<txt.length){const sp=txt.lastIndexOf(' ',b);if(sp>first+12)b=sp;}
  return (a>0?'…':'')+markedHTML(txt.slice(a,b),terms)+(b<txt.length?'…':'');
}
function crumb(id){
  const s=SEC[id];return s?s.n+' '+s[lang]:UI[lang].overview;
}
function matchIn(list,terms){return list.filter(e=>terms.every(tm=>(tm.strict?e.lower:e.fold).includes(tm.s)&&findRanges(e.text,[tm]).length));}

function runSearch(fromInput){
  const ui=UI[lang];
  clearMarks();
  index=collect(main);
  const raw=q.value,found=resolveTerms(index,raw),terms=found.terms;
  hits=[];cur=-1;
  clr.hidden=!raw;
  if(!terms.length){
    rail.dataset.view='toc';results.innerHTML='';statusEl.textContent='';
    hint.textContent='/';hint.classList.add('key');hint.hidden=!!raw;
    if(fromInput)setOpen(false);
    return;
  }
  const matched=found.matched;
  matched.forEach(e=>e.nodes.forEach(n=>markNode(n,terms)));
  hits=matched.map(e=>e.el);
  rail.dataset.view='results';
  statusEl.textContent=matched.length?ui.matches(matched.length):ui.none(raw.trim());
  hint.classList.remove('key');hint.hidden=false;hint.textContent=String(hits.length);
  if(matched.length){
    results.innerHTML=`<div class="res-head"><span>${ui.matches(matched.length)}</span><button type="button" class="linkbtn" data-clear>${ui.clear}</button></div>`+
      matched.map((e,i)=>`<a class="res" href="#${e.sec}" data-hit="${i}"><span class="crumb">${esc(crumb(e.sec))}</span><span class="snip">${snippet(e,terms)}</span></a>`).join('')+
      `<p class="res-tip">${ui.tip}</p>`;
  }else{
    const o=lang==='en'?'vi':'en';
    if(!otherCache[o]){const d=document.createElement('div');d.innerHTML=view(o);otherCache[o]=collect(d);}
    const n=resolveTerms(otherCache[o],raw).matched.length;
    results.innerHTML=`<div class="res-empty"><p>${esc(ui.none(raw.trim()))}</p>`+
      (n?`<p class="muted">${ui.other(n)}</p><button type="button" class="linkbtn" data-set-lang="${o}">${ui.switchTo}</button>`
        :`<p class="muted">${ui.tryShort}</p>`)+`</div>`;
  }
  if(fromInput)setOpen(true);
}
function goHit(i){
  if(!hits.length)return;
  cur=(i+hits.length)%hits.length;
  const el=hits[cur];
  el.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'center'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  hint.textContent=(cur+1)+'/'+hits.length;
  $$('.res',results).forEach(a=>{
    const on=+a.dataset.hit===cur;
    if(on){a.setAttribute('aria-current','true');keepVisible(a);}else a.removeAttribute('aria-current');
  });
}
function clearSearch(focus){q.value='';runSearch(true);if(focus)q.focus();}

/* ---------- contents panel ---------- */
function setOpen(on){rail.dataset.open=on?'1':'';menuBtn.setAttribute('aria-expanded',on?'true':'false');}
function keepVisible(el){
  if(!el||getComputedStyle(panel).position==='absolute'&&rail.dataset.open!=='1')return;
  const p=panel.getBoundingClientRect(),r=el.getBoundingClientRect();
  if(r.top<p.top+8)panel.scrollTop-=(p.top+8-r.top);
  else if(r.bottom>p.bottom-8)panel.scrollTop+=(r.bottom-p.bottom+8);
}
function spy(){
  if(!spyEls.length)return;
  const line=(parseFloat(getComputedStyle(root).getPropertyValue('--bar-h'))||0)+110;
  let id=spyEls[0].dataset.spy;
  for(const el of spyEls){if(el.getBoundingClientRect().top<=line)id=el.dataset.spy;else break;}
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4&&window.scrollY>0)id=spyEls[spyEls.length-1].dataset.spy;
  if(id===active&&$('.toc a.on'))return;
  active=id;
  $$('.toc a').forEach(a=>{
    const on=a.dataset.target===id;
    a.classList.toggle('on',on);
    if(on){a.setAttribute('aria-current','location');keepVisible(a);}else a.removeAttribute('aria-current');
  });
}
let ticking=false;
function onScroll(){if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;spy();});}

function jump(id){
  if(id==='top'){window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});}
  else{const el=document.getElementById(id);if(!el)return;el.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});}
  try{history.replaceState(null,'',id==='top'?location.pathname+location.search:'#'+id);}catch(e){}
}

/* ---------- element demo engine (Web Animations, one loop per demo) ---------- */
let demoStates=[],demoIO=null;
function kfs(frames,prop,D){
  const f=frames.slice().sort((a,b)=>a[0]-b[0]);
  if(f[0][0]>0)f.unshift([0,f[0][1]]);
  if(f[f.length-1][0]<D)f.push([D,f[f.length-1][1]]);
  return f.map(([t,v,e])=>({offset:Math.min(1,Math.max(0,t/D)),[prop]:v,easing:e||'ease-in-out'}));
}
function applyDemo(st){const run=st.vis&&!st.user;st.anims.forEach(a=>{try{if(run)a.play();else a.pause();}catch(e){}});}
function startDemos(){
  demoStates.forEach(st=>st.anims.forEach(a=>{try{a.cancel();}catch(e){}}));demoStates=[];
  if(demoIO){demoIO.disconnect();demoIO=null;}
  if(!Element.prototype.animate)return;
  $$('.demo',main).forEach(fig=>{
    const def=DEMOS[fig.dataset.demo];if(!def)return;
    const D=def.D,anims=[];
    [['.scene','opacity',[[0,0],[.35,1],[D-.45,1],[D,0]]]].concat(def.tracks()).forEach(([sel,prop,frames])=>{
      fig.querySelectorAll(sel).forEach(el=>{try{anims.push(el.animate(kfs(frames,prop,D),{duration:D*1000,iterations:Infinity}));}catch(e){}});
    });
    const st={fig,anims,user:false,vis:true};fig._demo=st;demoStates.push(st);
  });
  if('IntersectionObserver' in window){
    demoIO=new IntersectionObserver(es=>es.forEach(e=>{const st=e.target._demo;if(!st)return;st.vis=e.isIntersecting;applyDemo(st);}),{rootMargin:'120px 0px'});
    demoStates.forEach(st=>demoIO.observe(st.fig));
  }
}

/* ---------- hero loop (play-screen sketch) ---------- */
let heroAnims=[];
function startHero(){
  heroAnims.forEach(a=>{try{a.cancel();}catch(e){}});heroAnims=[];
  const f=$('#field');if(!f||reduceMotion||!Element.prototype.animate)return;
  $$('g,circle,rect,path,text',f).forEach(el=>{el.style.transformBox='fill-box';el.style.transformOrigin='center';});
  heroTracks().forEach(([sel,prop,frames])=>{
    $$(sel,f).forEach(el=>{try{heroAnims.push(el.animate(kfs(frames,prop,HERO_D),{duration:HERO_D*1000,iterations:Infinity}));}catch(e){}});
  });
  if(paused)heroAnims.forEach(a=>{try{a.pause();}catch(e){}});
}

/* ---------- render + language ---------- */
function render(){
  const ui=UI[lang];
  root.lang=lang;root.dataset.lang=lang;document.title=ui.title;
  main.innerHTML=view(lang);
  toc.innerHTML=tocHTML(lang);
  $('#brandSub').textContent=ui.sub;
  q.placeholder=narrow.matches?ui.searchShort:ui.search;q.setAttribute('aria-label',ui.search);
  clr.setAttribute('aria-label',ui.clear);
  menuBtn.setAttribute('aria-label',ui.contents);toc.setAttribute('aria-label',ui.contents);
  $('#langSwitch').setAttribute('aria-label',ui.language);
  $$('#langSwitch [data-set-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.setLang===lang?'true':'false'));
  spyEls=$$('[data-spy]',main);
  runSearch(false);
  spy();
  startDemos();
  startHero();
  gaugeUI();
  if(G.swing&&!G.raf)G.raf=requestAnimationFrame(gaugeTick);
}
function setLang(l){
  if(l===lang||(l!=='en'&&l!=='vi'))return;
  const anchor=document.getElementById(active),before=anchor?anchor.getBoundingClientRect().top:null,atTop=window.scrollY<8;
  lang=l;
  try{localStorage.setItem(KEY,l);}catch(e){}
  render();
  if(!atTop&&before!==null){
    const el=document.getElementById(active);
    if(el)window.scrollBy(0,el.getBoundingClientRect().top-before);
  }
  spy();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tg=e.target;
  const lb=tg.closest('[data-set-lang]');
  if(lb){setLang(lb.dataset.setLang);return;}
  if(tg.closest('[data-clear]')||tg.closest('#clr')){clearSearch(true);return;}
  if(tg.closest('#menuBtn')){
    const open=rail.dataset.open==='1';
    if(!open)rail.dataset.view='toc';
    setOpen(!open);
    if(!open)keepVisible($('.toc a.on'));
    return;
  }
  const a=tg.closest('a[href^="#"]');
  if(a){
    e.preventDefault();
    if(a.dataset.hit!=null)goHit(+a.dataset.hit);
    else jump(decodeURIComponent(a.getAttribute('href').slice(1)));
    setOpen(false);
    return;
  }
  const db=tg.closest('.demo-btn');
  if(db){const st=db.closest('.demo')._demo;const on=db.getAttribute('aria-pressed')!=='true';db.setAttribute('aria-pressed',on?'true':'false');db.setAttribute('aria-label',on?UI[lang].playDemo:UI[lang].pauseDemo);if(st){st.user=on;applyDemo(st);}return;}
  if(tg.closest('#gBonus')){
    if(G.swing){G.swing=false;G.res='bonus';}
    else{G.res=null;startSwing();}
    gaugeUI();return;
  }
  if(tg.closest('#gNext')){G.res='next';startSwing();gaugeUI();return;}
  const pb=tg.closest('#pauseBtn');
  if(pb){paused=!paused;$('#field').classList.toggle('paused',paused);pb.textContent=paused?UI[lang].play:UI[lang].pause;heroAnims.forEach(a=>{try{paused?a.pause():a.play();}catch(e){}});return;}
  const lg=tg.closest('.legend button');
  if(lg){
    const was=lg.getAttribute('aria-pressed')==='true';
    $$('.legend button').forEach(b=>b.setAttribute('aria-pressed','false'));
    if(!was){lg.setAttribute('aria-pressed','true');$('#field').dataset.hl=lg.dataset.part;}
    else delete $('#field').dataset.hl;
    return;
  }
  if(!tg.closest('.rail'))setOpen(false);
});
function hoverPart(e,on){
  const b=e.target.closest&&e.target.closest('.legend button');if(!b)return;
  const f=$('#field');if(!f)return;
  if(on)f.dataset.hl=b.dataset.part;
  else{const p=$('.legend button[aria-pressed="true"]');if(p)f.dataset.hl=p.dataset.part;else delete f.dataset.hl;}
}
main.addEventListener('mouseover',e=>hoverPart(e,true));
main.addEventListener('mouseout',e=>hoverPart(e,false));
main.addEventListener('focusin',e=>hoverPart(e,true));
main.addEventListener('focusout',e=>hoverPart(e,false));

q.addEventListener('input',()=>runSearch(true));
q.addEventListener('focus',()=>{if(parseTerms(q.value).length){rail.dataset.view='results';setOpen(true);}});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();if(hits.length){goHit(cur+(e.shiftKey?-1:1));setOpen(false);}}
  else if(e.key==='Escape'){e.preventDefault();if(q.value)clearSearch(true);else{setOpen(false);q.blur();}}
});
document.addEventListener('keydown',e=>{
  const el=document.activeElement,typing=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
  if((e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();q.focus();q.select();}
  else if(e.key==='Escape'&&!typing)setOpen(false);
});
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);
const onNarrow=()=>{q.placeholder=narrow.matches?UI[lang].searchShort:UI[lang].search;if(!narrow.matches)setOpen(false);};
if(narrow.addEventListener)narrow.addEventListener('change',onNarrow);else if(narrow.addListener)narrow.addListener(onNarrow);

render();
try{
  const h=decodeURIComponent((location.hash||'').slice(1));
  if(h&&document.getElementById(h))requestAnimationFrame(()=>{document.getElementById(h).scrollIntoView({block:'start'});spy();});
}catch(e){}
})();
</script>
</body>
